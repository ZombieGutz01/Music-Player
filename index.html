<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Music dump</title>
  <style>
    body {
      font-family: sans-serif;
      background: #d6f0ff;
      padding: 20px;
      color: black;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
    }

    /* MAIN PLAYER BOX (center) */
    .player {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 400px;
    }

    /* LEFT VIOLIN BOX */
    #violinBox {
      width: 200px;
      min-height: 250px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }

    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 10px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      background: #cce8ff;
      color: black;
      transition: 0.2s;
    }
    li:hover {
      background: #b8dbff;
      box-shadow: 0 0 10px rgba(140, 190, 255, 0.8);
    }

    audio {
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }

    /* NIGHT MODE AUDIO CONTROL FIXES */
    .night audio::-webkit-media-controls-panel {
      background-color: #2b2b2b !important;
    }
    .night audio::-webkit-media-controls-play-button {
      background-color: #444 !important;
      border-radius: 50%;
    }
    .night audio::-webkit-media-controls-timeline {
      background-color: #444 !important;
    }

    .credits {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- LEFT SIDE VIOLIN BOX -->
  <div id="violinBox">
    <h3>My Violin Covers</h3>
    <ul id="violinList"></ul>
  </div>

  <!-- MAIN PLAYER -->
  <div class="player">
    <h2>Music dump</h2>
    <p>Click a song to play it:</p>

   <ul id="playlist">
  <li data-src="love.mp3">Love – Bensound</li>
  <li data-src="dreams.mp3">Dreams – Bensound</li>
  <li data-src="anewbeginning.mp3">A New Beginning - Bensound</li>
  <li data-src="beyondtheline.mp3">Beyond The Line - Bensound</li>
</ul>

    <p id="nowPlaying" style="font-size:14px; color:#555; margin-top:10px; display:none;"></p>
    <audio id="audioPlayer" controls></audio>

    <div style="text-align:center; margin-top:20px;">
      <button id="modeToggle" style="padding:8px 14px; border:none; border-radius:8px; background:#cce8ff; cursor:pointer;">
        Switch to Night Mode
      </button>
    </div>

    <div class="credits">
      Music: <a href="https://www.bensound.com" target="_blank">Bensound.com</a>
      - ALL violin covers are mine.
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const items = document.querySelectorAll('#playlist li');
    const nowPlaying = document.getElementById('nowPlaying');
    const modeToggle = document.getElementById('modeToggle');

    items.forEach(item => {
      item.addEventListener('click', () => {
        audio.src = item.getAttribute('data-src');
        audio.play();
        nowPlaying.innerText = "Now Playing: " + item.innerText;
        nowPlaying.style.display = 'block';
      });
    });

    let night = false;

    modeToggle.addEventListener('click', () => {
      night = !night;
      document.body.classList.toggle('night', night);

      if (night) {
        document.body.style.background = '#1a1a1a';

        document.querySelectorAll('.player, #violinBox').forEach(box => {
          box.style.background = '#2b2b2b';
          box.style.color = 'black';
        });

        document.querySelectorAll('li').forEach(b => {
          b.style.background = '#0d1b3a';
          b.style.color = 'black';
        });

        modeToggle.innerText = 'Switch to Day Mode';
        modeToggle.style.background = '#555';

      } else {
        document.body.style.background = '#d6f0ff';

        document.querySelectorAll('.player, #violinBox').forEach(box => {
          box.style.background = 'white';
          box.style.color = 'black';
        });

        document.querySelectorAll('li').forEach(b => {
          b.style.background = '#cce8ff';
          b.style.color = 'black';
        });

        modeToggle.innerText = 'Switch to Night Mode';
        modeToggle.style.background = '#cce8ff';
      }
    });
  </script>

</body>
</html>
