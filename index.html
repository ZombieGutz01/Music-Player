<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>My Music Player</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .player {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    audio {
      width: 100%;
      margin-top: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 10px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      background: #eaeaea;
    }
    li:hover {
      background: #dcdcdc;
    }
    .credits {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="player">
    <h2>My Music Player</h2>
    <p>Click a song to play it:</p>
    <ul id="playlist">
      <li data-src="love.mp3">Love – Bensound</li>
      <li data-src="dreams.mp3">Dreams – Bensound</li>
    </ul>
    <audio id="audioPlayer" controls></audio>

    <div class="credits">
      Music: <a href="https://www.bensound.com" target="_blank">Bensound.com</a>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const items = document.querySelectorAll('#playlist li');

    items.forEach(item => {
      item.addEventListener('click', () => {
        audio.src = item.getAttribute('data-src');
        audio.play();
      });
    });
  </script>
</body>
</html>
