<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Music dump</title>
  <style>
    body {
      font-family: sans-serif;
      background: #d6f0ff; /* soft ice blue */
      padding: 20px;
      color: black;
    }
    .player {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    audio {
      width: 100%;
      margin-top: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 10px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      background: #cce8ff; /* soft baby blue */
      color: #000;
      transition: 0.2s;
    }
    li:hover {
      background: #b8dbff;
      box-shadow: 0 0 10px rgba(140, 190, 255, 0.8);
    }
    .credits {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="player">
    <h2>Music dump</h2>
    <p>Click a song to play it:</p>

    <ul id="playlist">
      <li data-src="love.mp3">Love – Bensound</li>
      <li data-src="dreams.mp3">Dreams – Bensound</li>
    </ul>

    <div class="player" id="violinBox" style="margin-top:20px;">
      <h3>My Violin Covers</h3>
      <ul id="violinList"></ul>
    </div>

    <p id="nowPlaying" style="font-size:14px; color:#555; margin-top:10px; display:none;"></p>
    <audio id="audioPlayer" controls></audio>

    <div style="text-align:center; margin-top:20px;">
      <button id="modeToggle" style="padding:8px 14px; border:none; border-radius:8px; background:#cce8ff; cursor:pointer;">
        Switch to Night Mode
      </button>
    </div>

    <div class="credits">
      Music: <a href="https://www.bensound.com" target="_blank">Bensound.com</a>
       - ALL violin covers are made by me. I do NOT own the original songs.
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const items = document.querySelectorAll('#playlist li');
    const nowPlaying = document.getElementById('nowPlaying');
    const modeToggle = document.getElementById('modeToggle');

    items.forEach(item => {
      item.addEventListener('click', () => {
        audio.src = item.getAttribute('data-src');
        audio.play();
        nowPlaying.innerText = "Now Playing: " + item.innerText;
        nowPlaying.style.display = 'block';
      });
    });

    let night = false;

    modeToggle.addEventListener('click', () => {
      night = !night;

      if (night) {
        /* NIGHT MODE */
        document.body.style.background = '#1a1a1a';
        document.body.style.color = 'black';

        document.querySelectorAll('.player').forEach(box => {
          box.style.background = '#2b2b2b';
          box.style.color = 'black';
        });

        document.querySelectorAll('li').forEach(b => {
          b.style.background = '#0d1b3a'; /* dark blue */
          b.style.color = 'black';
        });

        /* Audio control background */
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.style.background = '#2b2b2b';
        audioPlayer.style.color = 'black';

        modeToggle.innerText = 'Switch to Day Mode';
        modeToggle.style.background = '#555';

      } else {
        /* DAY MODE */
        document.body.style.background = '#d6f0ff';
        document.body.style.color = 'black';

        document.querySelectorAll('.player').forEach(box => {
          box.style.background = 'white';
          box.style.color = 'black';
        });

        document.querySelectorAll('li').forEach(b => {
          b.style.background = '#cce8ff';
          b.style.color = 'black';
        });

        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.style.background = 'white';
        audioPlayer.style.color = 'black';

        modeToggle.innerText = 'Switch to Night Mode';
        modeToggle.style.background = '#cce8ff';
      }
    });
  </script>
</body>
</html>
